# ── Main advisory platform (6amadvise.com) ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name 6amadvise.com www.6amadvise.com;

    ssl_certificate     /etc/letsencrypt/live/6amadvise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/6amadvise.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/x-javascript application/xml application/json
                    application/javascript image/svg+xml;

    # Upload size (KYC docs up to 10MB per file)
    client_max_body_size 50M;

    # Static Next.js assets — long cache
    location /_next/static/ {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_valid 200 1y;
    }

    # Next.js image optimisation
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1h;
    }

    # Public static files
    location /favicon.ico {
        proxy_pass http://nextjs;
        add_header Cache-Control "public, max-age=86400";
    }

    # All other requests → Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass                  $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
