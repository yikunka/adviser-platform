<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" fill="none">
  <defs>
    <!-- Background -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1A1408" />
      <stop offset="100%" stop-color="#0C0C0C" />
    </radialGradient>

    <!-- Gold shimmer gradient -->
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0" />
      <stop offset="30%" stop-color="#C9A96E" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#E8C87A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </linearGradient>

    <!-- Radial glow for central emblem -->
    <radialGradient id="emblem-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>

    <!-- Vertical fade mask -->
    <linearGradient id="fade-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="85%" stop-color="white" stop-opacity="0.5" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="mask-fade-v">
      <rect width="1440" height="640" fill="url(#fade-v)" />
    </mask>

    <filter id="blur-soft">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="640" fill="url(#bg-glow)" />

  <!-- Subtle perspective grid (horizontal lines) -->
  <g mask="url(#mask-fade-v)" opacity="0.18">
    <!-- Converging horizontal lines toward centre vanishing point -->
    <line x1="0" y1="200" x2="1440" y2="200" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="0" y1="250" x2="1440" y2="250" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="0" y1="300" x2="1440" y2="300" stroke="#C9A96E" stroke-width="0.35" />
    <line x1="0" y1="350" x2="1440" y2="350" stroke="#C9A96E" stroke-width="0.3" />
    <line x1="0" y1="400" x2="1440" y2="400" stroke="#C9A96E" stroke-width="0.25" />
    <line x1="0" y1="450" x2="1440" y2="450" stroke="#C9A96E" stroke-width="0.2" />
    <line x1="0" y1="500" x2="1440" y2="500" stroke="#C9A96E" stroke-width="0.15" />
  </g>

  <!-- Perspective vertical lines converging to centre -->
  <g mask="url(#mask-fade-v)" opacity="0.1">
    <line x1="720" y1="0" x2="0" y2="640" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="720" y1="0" x2="180" y2="640" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="720" y1="0" x2="360" y2="640" stroke="#C9A96E" stroke-width="0.3" />
    <line x1="720" y1="0" x2="540" y2="640" stroke="#C9A96E" stroke-width="0.3" />
    <line x1="720" y1="0" x2="1440" y2="640" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="720" y1="0" x2="1260" y2="640" stroke="#C9A96E" stroke-width="0.4" />
    <line x1="720" y1="0" x2="1080" y2="640" stroke="#C9A96E" stroke-width="0.3" />
    <line x1="720" y1="0" x2="900" y2="640" stroke="#C9A96E" stroke-width="0.3" />
  </g>

  <!-- Central radial glow -->
  <ellipse cx="720" cy="220" rx="480" ry="260" fill="url(#emblem-glow)" />

  <!-- Outer decorative ring -->
  <circle cx="720" cy="220" r="160" stroke="#C9A96E" stroke-width="0.5" stroke-opacity="0.25" fill="none" />
  <circle cx="720" cy="220" r="130" stroke="#C9A96E" stroke-width="0.4" stroke-opacity="0.2" fill="none" />
  <circle cx="720" cy="220" r="100" stroke="#C9A96E" stroke-width="0.4" stroke-opacity="0.15" fill="none" stroke-dasharray="4 8" />

  <!-- Central emblem — stylised building / shield -->
  <!-- Outer shield outline -->
  <path
    d="M720 80 L790 110 L790 200 Q790 260 720 285 Q650 260 650 200 L650 110 Z"
    stroke="#C9A96E"
    stroke-width="1.2"
    stroke-opacity="0.55"
    fill="rgba(201,169,110,0.04)"
  />
  <!-- Inner shield accent -->
  <path
    d="M720 100 L772 124 L772 198 Q772 246 720 267 Q668 246 668 198 L668 124 Z"
    stroke="#C9A96E"
    stroke-width="0.6"
    stroke-opacity="0.3"
    fill="none"
  />

  <!-- Building columns inside shield -->
  <rect x="699" y="155" width="6" height="65" fill="#C9A96E" fill-opacity="0.45" rx="1" />
  <rect x="711" y="148" width="6" height="72" fill="#C9A96E" fill-opacity="0.55" rx="1" />
  <rect x="723" y="148" width="6" height="72" fill="#C9A96E" fill-opacity="0.55" rx="1" />
  <rect x="735" y="155" width="6" height="65" fill="#C9A96E" fill-opacity="0.45" rx="1" />

  <!-- Pediment top of building -->
  <path d="M696 155 L720 135 L744 155 Z" fill="#C9A96E" fill-opacity="0.35" />
  <!-- Base of building -->
  <rect x="694" y="221" width="52" height="5" fill="#C9A96E" fill-opacity="0.4" rx="1" />

  <!-- Corner decorative dots on the emblem ring -->
  <circle cx="720" cy="62" r="2.5" fill="#C9A96E" fill-opacity="0.5" />
  <circle cx="720" cy="378" r="2.5" fill="#C9A96E" fill-opacity="0.5" />
  <circle cx="562" cy="220" r="2.5" fill="#C9A96E" fill-opacity="0.5" />
  <circle cx="878" cy="220" r="2.5" fill="#C9A96E" fill-opacity="0.5" />

  <!-- Horizontal gold rule below emblem -->
  <rect x="320" y="440" width="800" height="1" fill="url(#gold-line)" rx="0.5" />

  <!-- Small ornamental diamond marks on rule -->
  <path d="M715 440 L720 434 L725 440 L720 446 Z" fill="#C9A96E" fill-opacity="0.6" />

  <!-- Floating data/chart motif — left panel -->
  <g opacity="0.22" transform="translate(120, 260)">
    <!-- Bar chart bars -->
    <rect x="0"  y="60" width="18" height="40" fill="#C9A96E" rx="2" />
    <rect x="26" y="40" width="18" height="60" fill="#C9A96E" rx="2" />
    <rect x="52" y="20" width="18" height="80" fill="#C9A96E" rx="2" />
    <rect x="78" y="30" width="18" height="70" fill="#C9A96E" rx="2" />
    <rect x="104" y="10" width="18" height="90" fill="#C9A96E" rx="2" />
    <!-- Axis -->
    <line x1="0" y1="100" x2="130" y2="100" stroke="#C9A96E" stroke-width="1" />
    <!-- Trend line -->
    <polyline points="9,80 35,60 61,40 87,50 113,20" stroke="#E8C87A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating globe motif — right panel -->
  <g opacity="0.18" transform="translate(1190, 200)">
    <circle cx="55" cy="55" r="52" stroke="#C9A96E" stroke-width="0.8" fill="none" />
    <!-- Latitude lines -->
    <ellipse cx="55" cy="55" rx="52" ry="18" stroke="#C9A96E" stroke-width="0.5" fill="none" />
    <ellipse cx="55" cy="55" rx="52" ry="38" stroke="#C9A96E" stroke-width="0.4" fill="none" />
    <!-- Meridian -->
    <line x1="55" y1="3" x2="55" y2="107" stroke="#C9A96E" stroke-width="0.5" />
    <ellipse cx="55" cy="55" rx="25" ry="52" stroke="#C9A96E" stroke-width="0.4" fill="none" />
  </g>

  <!-- Bottom shimmer line -->
  <rect x="0" y="638" width="1440" height="1" fill="url(#gold-line)" opacity="0.6" />
</svg>
