<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <!-- Deep dark base — left is richest black, right opens slightly -->
    <linearGradient id="bg-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#020103"/>
      <stop offset="45%"  stop-color="#07040A"/>
      <stop offset="100%" stop-color="#100818"/>
    </linearGradient>

    <!-- Warm gold glow centred on ring position (≈70 % x, 50 % y) -->
    <radialGradient id="glow-ring" cx="70%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#C9A96E" stop-opacity="0.14"/>
      <stop offset="55%"  stop-color="#C9A96E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle cool-violet depth on upper right -->
    <radialGradient id="glow-violet" cx="80%" cy="20%" r="40%">
      <stop offset="0%"   stop-color="#6040A0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6040A0" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint warm ember at lower centre — visual weight anchor -->
    <radialGradient id="glow-ember" cx="55%" cy="85%" r="35%">
      <stop offset="0%"   stop-color="#8B3A20" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B3A20" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur-xl"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="blur-lg"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="url(#bg-h)"/>

  <!-- Ring halo -->
  <ellipse cx="1008" cy="450" rx="560" ry="420" fill="url(#glow-ring)" filter="url(#blur-xl)"/>

  <!-- Cool-violet upper-right depth -->
  <ellipse cx="1152" cy="180" rx="440" ry="340" fill="url(#glow-violet)" filter="url(#blur-xl)"/>

  <!-- Ember anchor bottom -->
  <ellipse cx="792" cy="765" rx="380" ry="260" fill="url(#glow-ember)" filter="url(#blur-lg)"/>

  <!-- Starfield — sparser on the left (text area), natural on the right -->
  <g opacity="0.5">
    <!-- Right / ring side -->
    <circle cx="900"  cy="55"  r="1.1" fill="#F5ECD0" opacity="0.9"/>
    <circle cx="1040" cy="100" r="0.8" fill="#C9A96E" opacity="0.7"/>
    <circle cx="1160" cy="38"  r="1.3" fill="#F5ECD0" opacity="0.85"/>
    <circle cx="1280" cy="80"  r="0.7" fill="#C9A96E" opacity="0.6"/>
    <circle cx="1370" cy="140" r="1.0" fill="#F5ECD0" opacity="0.75"/>
    <circle cx="1420" cy="55"  r="0.6" fill="#D4A0B0" opacity="0.55"/>
    <circle cx="980"  cy="200" r="0.8" fill="#C9A96E" opacity="0.5"/>
    <circle cx="1100" cy="260" r="0.6" fill="#F5ECD0" opacity="0.55"/>
    <circle cx="1300" cy="195" r="0.9" fill="#C9A96E" opacity="0.5"/>
    <circle cx="1380" cy="310" r="1.1" fill="#F5ECD0" opacity="0.6"/>
    <circle cx="860"  cy="750" r="1.0" fill="#D4A0B0" opacity="0.4"/>
    <circle cx="1100" cy="720" r="0.8" fill="#F5ECD0" opacity="0.45"/>
    <circle cx="1250" cy="800" r="1.2" fill="#C9A96E" opacity="0.4"/>
    <circle cx="1350" cy="650" r="0.7" fill="#F5ECD0" opacity="0.55"/>
    <!-- Left / text side — very sparse so they don't compete with type -->
    <circle cx="60"   cy="80"  r="0.8" fill="#F5ECD0" opacity="0.35"/>
    <circle cx="190"  cy="145" r="0.6" fill="#C9A96E" opacity="0.3"/>
    <circle cx="310"  cy="55"  r="0.9" fill="#F5ECD0" opacity="0.4"/>
    <circle cx="80"   cy="700" r="0.7" fill="#C9A96E" opacity="0.25"/>
    <circle cx="240"  cy="810" r="0.8" fill="#F5ECD0" opacity="0.3"/>
    <!-- Mid -->
    <circle cx="620"  cy="35"  r="1.0" fill="#F5ECD0" opacity="0.6"/>
    <circle cx="750"  cy="75"  r="0.7" fill="#C9A96E" opacity="0.5"/>
    <circle cx="600"  cy="850" r="0.8" fill="#C9A96E" opacity="0.35"/>
  </g>
</svg>
